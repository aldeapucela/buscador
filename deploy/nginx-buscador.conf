# Vhost para buscador.aldeapucela.org en el nginx del host de oracle-server.
#
# Requisito previo: un registro A buscador.aldeapucela.org → IP pública del servidor,
# resolviendo ya (certbot lo comprueba). Si el DNS está en Cloudflare, en modo "solo DNS"
# (nube gris): con la nube naranja el reto ACME por webroot falla.
#
# Instalación (en el servidor):
#   sudo cp nginx-buscador.conf /etc/nginx/sites-available/buscador
#   sudo ln -s /etc/nginx/sites-available/buscador /etc/nginx/sites-enabled/buscador
#   sudo nginx -t && sudo systemctl reload nginx        # SIEMPRE -t antes: n8n usa el mismo nginx
#   sudo certbot certonly --webroot -w /var/www/html -d buscador.aldeapucela.org
#   # descomentar el bloque 443 de abajo y volver a: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name buscador.aldeapucela.org;

    # Reto de certbot antes de que exista el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

